name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: Run lint
        run: |
          ruff check .

      - name: Run tests
        run: |
          pytest

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:

      - uses: actions/checkout@v4

      - name: Build API image
        run: |
          docker build --target api -t dropme-api .

      - name: Build Worker image
        run: |
          docker build --target worker -t dropme-worker .

      - name: Scan API image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: dropme-api
          format: table