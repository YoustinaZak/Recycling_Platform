name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:

    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dropme
          POSTGRES_PASSWORD: dropme
          POSTGRES_DB: dropme_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dropme -d dropme_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: Run lint
        run: |
          ruff check .

      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg2://dropme:dropme@localhost:5432/dropme_test
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest

  docker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: test
    steps:

      - uses: actions/checkout@v4

      - name: Build API image
        run: |
          docker build --target api -t dropme-api .

      - name: Build Worker image
        run: |
          docker build --target worker -t dropme-worker .

      - name: Scan API image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: dropme-api
          format: table