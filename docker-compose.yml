services:

  api:
    build:
      context: .
      target: api
    container_name: dropme-api
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    expose:
      - "5000"
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    container_name: dropme-worker
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: dropme-postgres
    environment:
      POSTGRES_DB: dropme
      POSTGRES_USER: dropme
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dropme -d dropme"]
      interval: 5s
      timeout: 5s
      retries: 5
    expose:
      - "5432"
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine
    container_name: dropme-valkey
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    expose:
      - "6379"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: dropme-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped
  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data: